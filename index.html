<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Estudos</title>
<meta name="theme-color" content="#0b0b0b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: pure-black app shell, one rounded sidebar card, fluid cards with hairline borders, mono numerals, white-on-black primary actions. Dark by choice. */
:root {
  --bg: #000000;
  --card: #0b0b0b;
  --card-2: #121212;
  --line: #1c1c1c;
  --line-2: #2c2c2c;
  --ink: #f1f1f1;
  --ink-2: #b4b4b4;
  --muted: #727272;
  --good: #0ca30c;
  --warn: #fab219;
  --bad: #e66767;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --hov: #141414; --sel: #1a1a1a; --inp: #0f0f0f; --pop: #151515; --modal: #0e0e0e; --track: #151515;
  --pri: #f5f5f5; --pri-h: #ffffff; --pri-ink: #000000; --focus: #8a8a8a; --bd-pill: #555; --bd-hov: #444; --arrow: #888; --mk: #888;
  --rowhov: #101010; --tagbg: #1b1b1b; --tsel: #161616; --code: #181818; --th: #141414; --mdink: #dcdcdc; --logbg: #080808; --toast: #181818; --prog: #1a1a1a;
  --grid: #262626; --goal: #9a9a9a; --goal-ink: #b4b4b4; --cross: #6a6a6a; --ring: #0b0b0b; --lblbox: #3a3a3a; --cell-hi: #ffffff; --cell-lo: #d8d8d8; --gauge: #1d1d1d;
  --ban-bd: #3a3320; --ban-bg: #15120a; --ban-ink: #e8d9a8; --err-bd: #4a2424; --err-bg: #170c0c; --err-ink: #f0b9b9;
  --scrim: rgba(0,0,0,.74); --shadow: rgba(0,0,0,.65);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f4f4f1; --card: #ffffff; --card-2: #f0f0ed; --line: #e4e4e0; --line-2: #d3d3ce;
  --ink: #151515; --ink-2: #484848; --muted: #6b6b6b;
  --good: #0a850a; --warn: #a86d00; --bad: #cf3a3a;
  --hov: #ebebe7; --sel: #e6e6e1; --inp: #ffffff; --pop: #ffffff; --modal: #ffffff; --track: #e9e9e5;
  --pri: #151515; --pri-h: #000000; --pri-ink: #ffffff; --focus: #6b6b6b; --bd-pill: #a8a8a2; --bd-hov: #b9b9b3; --arrow: #777; --mk: #555;
  --rowhov: #f3f3f0; --tagbg: #ecece8; --tsel: #ececE8; --code: #ecece8; --th: #efefeb; --mdink: #2b2b2b; --logbg: #f7f7f4; --toast: #ffffff; --prog: #e6e6e1;
  --grid: #dededa; --goal: #8a8a85; --goal-ink: #555; --cross: #8a8a85; --ring: #ffffff; --lblbox: #c9c9c3; --cell-hi: #141414; --cell-lo: #141414; --gauge: #e6e6e1;
  --ban-bd: #e3d49a; --ban-bg: #fbf5df; --ban-ink: #6b5410; --err-bd: #e6b3b3; --err-bg: #fdecec; --err-ink: #8a2525;
  --scrim: rgba(20,20,20,.38); --shadow: rgba(0,0,0,.14);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
[hidden] { display: none !important; }

/* shell */
.app { height: 100%; display: grid; grid-template-rows: 46px minmax(0, 1fr); }
.titlebar { display: flex; align-items: center; gap: 12px; padding: 0 20px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: .01em; }
.brand svg { display: block; }
.brand b { font-weight: 700; }
.crumb { color: var(--muted); font-size: 13px; }
.tb-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.chip-info, .model-sel { box-sizing: border-box; height: 30px; display: inline-flex; align-items: center; min-height: 0; font: 12px/1 var(--mono); color: var(--ink-2); background-color: var(--card); border: 1px solid var(--line-2); border-radius: 999px; padding: 0 12px; white-space: nowrap; margin: 0; }
.icon-btn { width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid transparent; background: transparent; border-radius: 9px; color: var(--ink-2); }
.icon-btn:hover { background: var(--card-2); border-color: var(--line); color: var(--ink); }
#menuBtn { display: grid; }
.shell { display: grid; grid-template-columns: 256px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: 20px; padding: 0 20px 18px 14px; min-height: 0; }
.side { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 12px; overflow: auto; align-self: stretch; }
.nav-home, .nav-g, .nav-i { display: flex; align-items: center; gap: 12px; width: 100%; background: transparent; border: 0; border-radius: 10px; color: var(--ink-2); text-align: left; }
.nav-home { padding: 11px 14px; font-weight: 600; font-size: 14px; color: var(--ink); }
.nav-home[aria-current="page"], .nav-i[aria-current="page"] { background: var(--sel); color: var(--ink); }
.nav-g { margin-top: 12px; padding: 10px 14px 10px 14px; font-size: 11px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--ink-2); justify-content: space-between; }
.nav-g:hover, .nav-i:hover, .nav-home:hover { background: var(--hov); }
.nav-g svg { transition: transform .15s; }
.nav-g[aria-expanded="true"] svg { transform: rotate(90deg); }
.nav-i { padding: 10px 14px; font-size: 13px; }
.nav-i svg, .nav-home svg { flex: none; opacity: .8; }
.main { overflow: auto; min-width: 0; padding: 2px 2px 20px 0; }
.view { display: grid; gap: 16px; align-content: start; }
.view-head { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; padding: 2px 2px 0; }
.view-head h1 { font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.view-head p { color: var(--muted); margin-top: 3px; max-width: 62ch; }
.view-head .grow { flex: 1; }

/* cards */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px; min-width: 0; }
.card.tight { padding: 16px 18px; }
.lbl { font-size: 11px; letter-spacing: .02em; text-transform: uppercase; color: var(--ink-2); }
.sub { font-size: 12px; color: var(--muted); }
.big { font: 600 34px/1.1 var(--mono); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.big small { font-size: 26px; font-weight: 500; margin-left: 6px; color: var(--ink-2); }
.g-top { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 16px; }
.g-bot { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.g-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.hero-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.hero-side { text-align: right; }
.hero-side .v { font: 600 15px var(--mono); margin-top: 4px; }
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 16px 0 6px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { border: 1px solid var(--line-2); border-radius: 999px; padding: 6px 14px; background: transparent; color: var(--ink-2); font-size: 12px; line-height: 1.2; }
.pill:hover { border-color: var(--bd-pill); color: var(--ink); }
.pill[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 500; }
.pill .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; vertical-align: 0; }
.pill .n { font-family: var(--mono); opacity: .65; margin-left: 6px; font-size: 11px; }

/* buttons & forms */
.btn { border: 1px solid var(--line-2); background: transparent; color: var(--ink); border-radius: 10px; padding: 9px 16px; font-size: 12.5px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:hover { background: var(--card-2); border-color: var(--bd-hov); }
.btn.primary { background: var(--pri); color: var(--pri-ink); border-color: var(--pri); letter-spacing: .02em; text-transform: uppercase; font-size: 12px; font-weight: 600; }
.btn.primary:hover { background: var(--pri-h); }
.btn.primary.block { width: 100%; padding: 14px; }
.btn.sm { padding: 6px 11px; font-size: 12px; border-radius: 8px; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; }
.link:hover { color: var(--ink); }
.field { display: grid; gap: 6px; }
.field > span { font-size: 11px; text-transform: uppercase; letter-spacing: .02em; color: var(--ink-2); }
input[type=text], input[type=number], input[type=date], input[type=time], select, textarea { width: 100%; background: var(--inp); border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 12px; min-height: 38px; }
textarea { resize: vertical; min-height: 84px; line-height: 1.5; }
input:focus, select:focus, textarea:focus { border-color: var(--focus); outline: none; }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--arrow) 50%), linear-gradient(135deg, var(--arrow) 50%, transparent 50%); background-position: calc(100% - 17px) 16px, calc(100% - 12px) 16px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
.row > .field { flex: 1 1 150px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }

/* tables */
.scroll-x { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; min-width: 640px; }
.tbl th { text-align: left; font-size: 11px; font-weight: 400; text-transform: uppercase; letter-spacing: .02em; color: var(--ink-2); padding: 0 10px 12px; }
.tbl td { padding: 11px 10px; border-top: 1px solid var(--line); vertical-align: middle; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--rowhov); }
.tbl td.num, .tbl th.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.tbl .ico { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--card-2); display: grid; place-items: center; color: var(--ink-2); flex: none; }
.cell-name { display: flex; align-items: center; gap: 14px; }
.cell-name .t { font-size: 13.5px; }
.cell-name .s { font-size: 11px; color: var(--muted); }
.delta { font-family: var(--mono); font-size: 12px; display: inline-flex; align-items: center; gap: 5px; }
.delta.up svg { color: var(--good); } .delta.down svg { color: var(--bad); }
.tag { display: inline-block; border: 1px solid var(--line-2); border-radius: 6px; padding: 1px 7px; font-size: 11px; color: var(--ink-2); }
.tag.solid { background: var(--tagbg); }
.go { color: var(--muted); }

/* charts */
.chart { position: relative; width: 100%; min-height: 120px; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { font: 10px var(--mono); fill: var(--muted); }
.chart .lblv { fill: var(--ink); font-size: 11px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0 0 8px; color: var(--ink-2); font-size: 12px; }
.legend i { display: inline-block; width: 14px; height: 2px; border-radius: 2px; margin-right: 7px; vertical-align: 3px; position: relative; }
.legend i::after { content: ""; position: absolute; left: 4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: inherit; box-shadow: 0 0 0 2px var(--card); }
.tip { position: absolute; pointer-events: none; z-index: 5; background: var(--pop); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 10px; font: 12px var(--mono); white-space: nowrap; box-shadow: 0 6px 24px rgba(0,0,0,.6); }
.tip .th { color: var(--ink-2); margin-bottom: 4px; font-family: var(--sans); font-size: 11px; }
.tip .tr { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.tip .tr b { font-weight: 500; }
.tip .sw { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.empty { color: var(--muted); padding: 34px 8px; text-align: center; border: 1px dashed var(--line-2); border-radius: 12px; }
.empty b { color: var(--ink-2); font-weight: 500; display: block; margin-bottom: 4px; }
.bars { display: grid; gap: 12px; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 150px) 1fr 64px; align-items: center; gap: 12px; }
.bar-row .n { color: var(--ink-2); white-space: normal; overflow: visible; overflow-wrap: anywhere; }
.bar-row .tr { height: 10px; background: var(--track); border-radius: 4px; position: relative; overflow: visible; }
.bar-row .fl { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; min-width: 2px; }
.bar-row .mk { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--mk); }
.bar-row .v { font: 12px var(--mono); text-align: right; color: var(--ink); white-space: nowrap; }
.bars.wide .bar-row { grid-template-columns: minmax(90px, 150px) 1fr 104px; }
.heat { border-collapse: separate; border-spacing: 3px; min-width: 100%; }
.heat th { font: 10px var(--mono); color: var(--muted); font-weight: 400; padding: 2px 4px; white-space: nowrap; }
.heat th.rh { text-align: left; font-family: var(--sans); font-size: 12px; color: var(--ink-2); padding-right: 12px; }
.heat td { text-align: center; font: 11px var(--mono); padding: 8px 6px; border-radius: 6px; min-width: 44px; }

/* health list */
.checks { display: grid; }
.check { display: grid; grid-template-columns: 22px 1fr; gap: 12px; padding: 13px 0; border-top: 1px solid var(--line); }
.check:first-child { border-top: 0; padding-top: 4px; }
.chk { width: 20px; height: 20px; border: 1px solid var(--bd-pill); border-radius: 4px; display: grid; place-items: center; margin-top: 1px; }
.chk.on { border-color: var(--good); color: var(--good); }
.chk.off { border-color: var(--warn); color: var(--warn); }
.check .t { font-size: 13.5px; }
.check .s { font-size: 12px; color: var(--muted); }
.events { display: grid; margin-top: 14px; }
.ev { display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); align-items: center; }
.ev:first-child { border-top: 0; }
.ev .ic { width: 30px; height: 30px; border: 1px solid var(--line-2); border-radius: 8px; display: grid; place-items: center; color: var(--ink-2); }
.ev .t { font-size: 13px; }
.ev .s { font-size: 11.5px; color: var(--muted); }
.ev .d { font: 11.5px var(--mono); color: var(--muted); }
.h-card { font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.kv { display: grid; gap: 11px; margin: 18px 0; }
.kv > div { display: flex; justify-content: space-between; gap: 12px; color: var(--ink-2); }
.kv > div { flex-wrap: wrap; }
.kv b { font: 500 13px var(--mono); color: var(--ink); text-align: right; margin-left: auto; min-width: 0; overflow-wrap: anywhere; }
.mini { border: 1px solid var(--line-2); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; margin: 14px 0 18px; }
.mini > div { display: flex; justify-content: space-between; gap: 12px; }
.mini > div span:first-child { color: var(--muted); font-size: 12px; }
.mini > div span:last-child { text-align: right; font-size: 13px; }
.ring-wrap { display: grid; place-items: center; padding: 10px 0 0; }
.banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; border: 1px solid var(--ban-bd); background: var(--ban-bg); color: var(--ban-ink); border-radius: 12px; padding: 11px 16px; }
.banner.err { border-color: var(--err-bd); background: var(--err-bg); color: var(--err-ink); }
.banner .btn { margin-left: auto; }

/* modal & toasts */
.scrim { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; padding: 16px; z-index: 50; }
.modal { width: min(640px, 100%); max-height: 94%; overflow: auto; background: var(--modal); border: 1px solid var(--line-2); border-radius: 16px; padding: 22px; box-shadow: 0 20px 60px var(--shadow); }
.modal.wide { width: min(860px, 100%); }
.modal h2 { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
.modal .lead { color: var(--muted); margin-bottom: 16px; }
.modal .foot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
.modal .form { display: grid; gap: 14px; }
.mrow { display: grid; grid-template-columns: minmax(110px, 1fr) 84px 20px 84px; gap: 8px; align-items: center; }
.mrow label { color: var(--ink-2); }
.mrow span { text-align: center; color: var(--muted); }
.mgrid { display: grid; gap: 8px; max-height: 300px; overflow: auto; padding-right: 4px; }
.total-line { font: 500 13px var(--mono); color: var(--ink-2); }
.toasts { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: grid; gap: 8px; z-index: 80; width: min(460px, calc(100% - 32px)); }
.toast { background: var(--toast); border: 1px solid var(--line-2); border-radius: 12px; padding: 11px 16px; box-shadow: 0 10px 30px var(--shadow); }
.toast.err { border-color: var(--err-bd); }
.log { font: 12px/1.7 var(--mono); color: var(--ink-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; max-height: 220px; overflow: auto; background: var(--logbg); }
.log .ok { color: var(--good); }
.progress { height: 6px; background: var(--prog); border-radius: 3px; overflow: hidden; margin: 12px 0; }
.progress > i { display: block; height: 100%; background: var(--ink); width: 0; transition: width .2s; }

/* questions */
.qs { display: grid; gap: 10px; }
.q { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: var(--card); display: grid; gap: 10px; }
.q.st-e { border-left: 3px solid var(--bad); }
.q.st-c { border-left: 3px solid var(--warn); }
.q.st-a { border-left: 3px solid var(--good); }
.q-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.q-head .n { font: 600 13px var(--mono); min-width: 40px; }
.q-head select { width: auto; min-height: 30px; padding: 3px 28px 3px 10px; font-size: 12px; border-radius: 8px; }
.q-head input[type=text] { width: 220px; flex: 1 1 160px; min-height: 30px; padding: 3px 10px; font-size: 12px; border-radius: 8px; }
.q-st { display: flex; gap: 6px; margin-left: auto; }
.st { border: 1px solid var(--line-2); background: transparent; border-radius: 8px; padding: 4px 10px; font-size: 12px; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
.st[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.q-txt { color: var(--ink-2); white-space: pre-wrap; font-size: 12.5px; line-height: 1.55; max-height: 220px; overflow: auto; border-top: 1px solid var(--line); padding-top: 10px; }
.q-foot { display: flex; gap: 12px; align-items: center; font-size: 12px; color: var(--muted); }

/* thread / caderno */
.cad { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
.tlist { display: grid; gap: 0; }
.titem { display: grid; gap: 3px; text-align: left; width: 100%; background: transparent; border: 0; border-top: 1px solid var(--line); padding: 13px 8px; border-radius: 0; color: var(--ink); }
.titem:first-child { border-top: 0; }
.titem:hover { background: var(--rowhov); }
.titem[aria-current="true"] { background: var(--tsel); border-radius: 10px; }
.titem .t { font-weight: 500; font-size: 13px; }
.titem .s { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.titem .m { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 11px; }
.thread { display: grid; gap: 0; }
.msg { padding: 16px 0; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.msg:first-child { border-top: 0; padding-top: 4px; }
.msg .who { display: flex; gap: 10px; align-items: center; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: var(--ink-2); }
.msg .who .tm { color: var(--muted); font-family: var(--mono); text-transform: none; letter-spacing: 0; }
.msg.me .body { white-space: pre-wrap; }

/* ============ markdown (subset) ============ */
function md(src) {
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*\w])\*(?!\s)([^*]+?)\*(?!\w)/g, '$1<i>$2</i>').replace(/`([^`]+)`/g, '<code>$1</code>');
  const out = []; let list = null, tbl = null;
  const flush = () => {
    if (list) { out.push(`<${list.t}>${list.items.join('')}</${list.t}>`); list = null; }
    if (tbl) { const [h, ...rows] = tbl; out.push(`<table><thead><tr>${h.map(c => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`); tbl = null; }
  };
  String(src || '').replace(/\r/g, '').split('\n').forEach(raw => {
    const l = raw.trimEnd(); let m;
    if (!l.trim()) { flush(); return; }
    if ((m = l.match(/^#{1,4}\s+(.*)/))) { flush(); out.push(`<h4>${inline(m[1])}</h4>`); return; }
    if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (!list || list.t !== 'ul') { flush(); list = { t: 'ul', items: [] }; } list.items.push(`<li>${inline(m[1])}</li>`); return; }
    if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (!list || list.t !== 'ol') { flush(); list = { t: 'ol', items: [] }; } list.items.push(`<li>${inline(m[1])}</li>`); return; }
    if (l.trim().startsWith('|')) {
      if (/^\|?[\s:\-|]+\|?$/.test(l.trim())) return;
      if (list) flush(); tbl = tbl || []; tbl.push(l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim())); return;
    }
    flush(); out.push(`<p>${inline(l)}</p>`);
  });
  flush(); return out.join('');
}

function spark(vals, w = 96, h = 26) {
  const pts = vals.map((v, i) => [i, v]).filter(p => p[1] != null);
  if (pts.length < 2) return '<span class="muted mono">—</span>';
  const lo = Math.min(...pts.map(p => p[1])), hi = Math.max(...pts.map(p => p[1])), span = hi - lo || 1, n = vals.length;
  const X = i => 2 + i * (w - 4) / (n - 1), Y = v => h - 3 - (v - lo) / span * (h - 8);
  const d = pts.map((p, k) => (k ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join('');
  const l = pts.at(-1);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--ink-2)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${X(l[0]).toFixed(1)}" cy="${Y(l[1]).toFixed(1)}" r="2.6" fill="var(--ink)"/></svg>`;
}

  simsAllSorted().filter(s => s.grupo).forEach(s => {
    const k = gKey(s.grupo), g = G.get(k) || { nome: s.grupo, parts: new Map(), data: s.data }; const m = modeloOf(s), old = g.parts.get(m.id);
    if (!old || (s.ts || 0) >= (old.ts || 0)) g.parts.set(m.id, s);
    if (s.data < g.data) g.data = s.data; G.set(k, g);
  });

  const ids = new Set(); gs.forEach(g => g.parts.forEach((_, id) => ids.add(id)));
  const mods = modelosAll().filter(m => ids.has(m.id));
  gs.forEach(g => { g.missing = mods.filter(m => !g.parts.has(m.id)); g.complete = !g.missing.length; g.a = 0; g.t = 0; g.parts.forEach(s => { const t = simStat(s); g.a += t.a; g.t += t.t; }); g.p = g.t ? g.a / g.t * 100 : null; });

}

const MATRIZ_TXT = "MATRIZ DE REFERÊNCIA DO ENEM (Inep/MEC, 2026) — use para classificar cada questão analisada pela competência de área (C) e habilidade (H) e pelo objeto de conhecimento. As habilidades H1–H30 são numeradas dentro de cada área.\nEIXOS COGNITIVOS (todas as áreas): I Dominar linguagens (DL); II Compreender fenômenos (CF); III Enfrentar situações-problema (SP); IV Construir argumentação (CA); V Elaborar propostas (EP).\n\n## LINGUAGENS, CÓDIGOS E SUAS TECNOLOGIAS\nC1 — Aplicar as tecnologias da comunicação e da informação na escola, no trabalho e em outros contextos relevantes para sua vida.\n  H1: Identificar as diferentes linguagens e seus recursos expressivos como elementos de caracterização dos sistemas de comunicação.\n  H2: Recorrer aos conhecimentos sobre as linguagens dos sistemas de comunicação e informação para resolver problemas sociais.\n  H3: Relacionar informações geradas nos sistemas de comunicação e informação, considerando a função social desses sistemas.\n  H4: Reconhecer posições críticas aos usos sociais que são feitos das linguagens e dos sistemas de comunicação e informação.\nC2 — Conhecer e usar língua(s) estrangeira(s) moderna(s) como instrumento de acesso a informações e a outras culturas e grupos sociais.\n  H5: Associar vocábulos e expressões de um texto em LEM ao seu tema.\n  H6: Utilizar os conhecimentos da LEM e de seus mecanismos como meio de ampliar as possibilidades de acesso a informações, tecnologias e culturas.\n  H7: Relacionar um texto em LEM, as estruturas linguísticas, sua função e seu uso social.\n  H8: Reconhecer a importância da produção cultural em LEM como representação da diversidade cultural e linguística.\nC3 — Compreender e usar a linguagem corporal como relevante para a própria vida, integradora social e formadora da identidade.\n  H9: Reconhecer as manifestações corporais de movimento como originárias de necessidades cotidianas de um grupo social.\n  H10: Reconhecer a necessidade de transformação de hábitos corporais em função das necessidades cinestésicas.\n  H11: Reconhecer a linguagem corporal como meio de interação social, considerando os limites de desempenho e as alternativas de adaptação para diferentes indivíduos.\nC4 — Compreender a arte como saber cultural e estético gerador de significação e integrador da organização do mundo e da própria identidade.\n  H12: Reconhecer diferentes funções da arte, do trabalho da produção dos artistas em seus meios culturais.\n  H13: Analisar as diversas produções artísticas como meio de explicar diferentes culturas, padrões de beleza e preconceitos.\n  H14: Reconhecer o valor da diversidade artística e das inter-relações de elementos que se apresentam nas manifestações de vários grupos sociais e étnicos.\nC5 — Analisar, interpretar e aplicar recursos expressivos das linguagens, relacionando textos com seus contextos, mediante a natureza, função, organização, estrutura das manifestações, de acordo com as condições de produção e recepção.\n  H15: Estabelecer relações entre o texto literário e o momento de sua produção, situando aspectos do contexto histórico, social e político.\n  H16: Relacionar informações sobre concepções artísticas e procedimentos de construção do texto literário.\n  H17: Reconhecer a presença de valores sociais e humanos atualizáveis e permanentes no patrimônio literário nacional.\nC6 — Compreender e usar os sistemas simbólicos das diferentes linguagens como meios de organização cognitiva da realidade pela constituição de significados, expressão, comunicação e informação.\n  H18: Identificar os elementos que concorrem para a progressão temática e para a organização e estruturação de textos de diferentes gêneros e tipos.\n  H19: Analisar a função da linguagem predominante nos textos em situações específicas de interlocução.\n  H20: Reconhecer a importância do patrimônio linguístico para a preservação da memória e da identidade nacional.\nC7 — Confrontar opiniões e pontos de vista sobre as diferentes ora social e formadora de identidade | Produção e recepção de textos artísticos: interpretação e representação do mundo para o fortalecimento dos processos de identidade e cidadania | Estudo do texto literário: relações entre produção literária e processo social, concepções artísticas, procedimentos de construção e recepção de textos | Estudo dos aspectos linguísticos em diferentes textos: recursos expressivos da língua, procedimentos de construção e recepção de textos | Estudo do texto argumentativo, seus gêneros e recursos linguísticos: argumentação — tipo, gêneros e usos em Língua Portuguesa | Estudo dos aspectos linguísticos da Língua Portuguesa: usos da língua — norma culta e variação linguística | Estudo dos gêneros digitais: tecnologia da comunicação e informação — impacto e função social\n\n## MATEMÁTICA E SUAS TECNOLOGIAS\nC1 — Construir significados para os números naturais, inteiros, racionais e reais.\n  H1: Reconhecer, no contexto social, diferentes significados e representações dos números e operações — naturais, inteiros, racionais ou reais.\n  H2: Identificar padrões numéricos ou princípios de contagem.\n  H3: Resolver situação-problema envolvendo conhecimentos numéricos.\n  H4: Avaliar a razoabilidade de um resultado numérico na construção de argumentos sobre afirmações quantitativas.\n  H5: Avaliar propostas de intervenção na realidade utilizando conhecimentos numéricos.\nC2 — Utilizar o conhecimento geométrico para realizar a leitura e a representação da realidade e agir sobre ela.\n  H6: Interpretar a localização e a movimentação de pessoas/objetos no espaço tridimensional e sua representação no espaço bidimensional.\n  H7: Identificar características de figuras planas ou espaciais.\n  H8: Resolver situação-problema que envolva conhecimentos geométricos de espaço e forma.\n  H9: Utilizar conhecimentos geométricos de espaço e forma na seleção de argumentos propostos como solução de problemas do cotidiano.\nC3 — Construir noções de grandezas e medidas para a compreensão da realidade e a solução de problemas do cotidiano.\n  H10: Identificar relações entre grandezas e unidades de medida.\n  H11: Utilizar a noção de escalas na leitura de representação de situação do cotidiano.\n  H12: Resolver situação-problema que envolva medidas de grandezas.\n  H13: Avaliar o resultado de uma medição na construção de um argumento consistente.\n  H14: Avaliar proposta de intervenção na realidade utilizando conhecimentos geométricos relacionados a grandezas e medidas.\nC4 — Construir noções de variação de grandezas para a compreensão da realidade e a solução de problemas do cotidiano.\n  H15: Identificar a relação de dependência entre grandezas.\n  H16: Resolver situação-problema envolvendo a variação de grandezas, direta ou inversamente proporcionais.\n  H17: Analisar informações envolvendo a variação de grandezas como recurso para a construção de argumentação.\n  H18: Avaliar propostas de intervenção na realidade envolvendo variação de grandezas.\nC5 — Modelar e resolver problemas que envolvem variáveis socioeconômicas ou técnico-científicas, usando representações algébricas.\n  H19: Identificar representações algébricas que expressem a relação entre grandezas.\n  H20: Interpretar gráfico cartesiano que represente relações entre grandezas.\n  H21: Resolver situação-problema cuja modelagem envolva conhecimentos algébricos.\n  H22: Utilizar conhecimentos algébricos/geométricos como recurso para a construção de argumentação.\n  H23: Avaliar propostas de intervenção na realidade utilizando conhecimentos algébricos.\nC6 — Interpretar informações de natureza científica e social obtidas da leitura de gráficos e tabelas, realizando previsão de tendência, extrapolação, interpolação e interpretação.\n  H24: Utilizar informações expressas em gráficos ou tabelas para fazer inferências.\n  H25: Resolver problema com dados apresentados em tabelas ou gráficos.\n  H26: Analisar informações expressas em gráficos ou tabelas como recurso para a construção de argumentos.\nC7 — Compreender o caráter aleatório e não determinístico dos fenômenos naturais e sociais, e utilizar instrumentos adequados para medidas, determinação de amostras e cálculos de probabilidade para interpretar informações de variáveis apresentadas em uma distribuição estatística.\n  H27: Calcular medidas de tendência central ou de dispersão de um conjunto de dados expressos em uma tabela de frequências de dados agrupados (não em classes) ou em gráficos.\n  H28: Resolver situação-problema que envolva conhecimentos de estatística e probabilidade.\n  H29: Utilizar conhecimentos de estatística e probabilidade como recurso para a construção de argumentação.\n  H30: Avaliar propostas de intervenção na realidade utilizando conhecimentos de estatística e probabilidade.\nObjetos de conhecimento (grupos): Conhecimentos numéricos | Conhecimentos geométricos | Conhecimentos de estatística e probabilidade | Conhecimentos algébricos | Conhecimentos algébricos/geométricos\n\n## CIÊNCIAS DA NATUREZA E SUAS TECNOLOGIAS\nC1 — Compreender as ciências naturais e as tecnologias a elas associadas como construções humanas, percebendo seus papéis nos processos de produção e no desenvolvimento econômico e social da humanidade.\n  H1: Reconhecer características ou propriedades de fenômenos ondulatórios ou oscilatórios, relacionando-os a seus usos em diferentes contextos.\n  H2: Associar a solução de problemas de comunicação, transporte, saúde ou outro, com o correspondente desenvolvimento científico e tecnológico.\n  H3: Confrontar interpretações científicas com interpretações baseadas no senso comum, ao longo do tempo ou em diferentes culturas.\n  H4: Avaliar propostas de intervenção no ambiente, considerando a qualidade da vida humana ou as medidas de conservação, recuperação ou utilização sustentável da biodiversidade.\nC2 — Identificar a presença e aplicar as tecnologias associadas às ciências naturais em diferentes contextos.\n  H5: Dimensionar circuitos ou ar o uso das tecnologias com os impactos sócio-ambientais em diferentes contextos histórico-geográficos.\n  H29: Reconhecer a função dos recursos naturais na produção do espaço geográfico, relacionando-os com as mudanças provocadas pelas ações humanas.\n  H30: Avaliar as relações entre preservação e degradação da vida no planeta nas diferentes escalas.\nObjetos de conhecimento (grupos): Diversidade cultural, conflitos e vida em sociedade | Formas de organização social, movimentos sociais, pensamento político e ação do Estado | Características e transformações das estruturas produtivas | Os domínios naturais e a relação do ser humano com o ambiente | Representação espacial\n\nREDAÇÃO: 5 competências (C1 norma culta; C2 compreensão da proposta e tema/gênero; C3 seleção e organização de argumentos; C4 coesão; C5 proposta de intervenção respeitando direitos humanos), 0–200 cada, total 1000.";

/* matérias que podem aparecer nesta prova: as do modelo (ex.: ENEM Dia 1 = Linguagens + Humanas) e as que valem em qualquer parte (Educação Física, Espanhol, Artes).
   Matérias de outro dia ou de outro modelo (Biologia no Dia 1) ficam de fora; matérias que você criou e não pertencem a nenhum modelo continuam. */
function matsPermitidas(M) {
  const mine = ((M && M.areas) || []).flatMap(a => a.mats || []);
  if (!mine.length) return [...new Set([...S.cfg.materias, ...Object.keys(EXTRA_MAT)])];
  const outras = new Set(modelos().flatMap(m => (m.areas || []).flatMap(a => a.mats || [])));
  return [...new Set([...mine, ...S.cfg.materias.filter(m => !outras.has(m)), ...Object.keys(EXTRA_MAT)])];
}

/* cada parte do caderno só tem as matérias dela (Educação Física vale em qualquer parte). Se a questão veio com matéria de outra parte, ela é reanalisada:
   1) matérias permitidas que dividem o mesmo assunto; 2) se não houver, o Claude escolhe pelo texto da questão; 3) senão 'Outra'. */
const matConhecida = m => modelos().some(x => (x.areas || []).some(a => (a.mats || []).includes(m)));

  if (!mat || mat === 'Outra' || mat === 'Educação Física' || !matConhecida(mat)) return false;

async function readKeyFile(file, nums, ui) {

    const KEEP = /quest[ãa]o|gabarito|resposta|alternativa|compet[êe]ncia|habilidade|\bC\s*\d|\bH\s*\d|^\s*\d{1,3}\s*[-–.:)]?\s*\(?[A-E]\b/i;

    let blobs = null; if (bt.pages) { try { blobs = await vis.render(bt.pages); } catch (e) { blobs = null; } }
    let out = null;

/* A a E ou A a D, conforme a prova; se já houver resposta ou gabarito fora do intervalo, a letra continua aparecendo */
const altLetters = (doc, q) => { const n = Math.max(4, Math.min(5, (doc && doc.alt) || 5)); let L = 'ABCDE'.slice(0, n).split(''); if (q) [q.resp, q.gab].forEach(x => { if (x && !L.includes(x) && /^[A-E]$/.test(x)) L = 'ABCDE'.slice(0, Math.max(L.length, 'ABCDE'.indexOf(x) + 1)).split(''); }); return L; };

/* ============ avisos do Claude: contradições, paradoxos e dúvidas ============

const AV_MAX = 40, avKey = s => subNorm(s).slice(0, 120);
function avSave(avisos, ok) {

  (list || []).forEach(o => {

    const k = (o.simId || '') + '|' + (o.rota || 'visao') + '|' + avKey(t); if (keys.has(k)) return; keys.add(k);

  });

/* contradições que o painel enxerga sozinho nos dados (somem quando você corrige) */
function avisosCalc() {
  const out = [];
  (S.sims || []).forEach(sim => {
    const doc = S.simq && S.simq[sim.id]; if (!doc || !(doc.itens || []).length) return;
    const nome = sim.nome || 'Simulado', dv = divergentes(doc);
    if (dv.length) out.push({ id: 'c:dv:' + sim.id, t: `${nome}: com o gabarito, ${dv.length} ${dv.length === 1 ? 'questão mudou' : 'questões mudaram'} em relação ao que você tinha marcado antes (${dv.map(q => q.n).slice(0, 12).join(', ')}). Confira se marcou a alternativa certa.`, r: 'sim-questoes', s: sim.id, o: 'Dados', calc: 1 });

    e.preventDefault();

  };
}


/* ---------- modelos de prova ---------- */
function modelosForm() {
  const D0 = clone(modelos());
  const areaHTML = a => `<div class="mod-area"><input type="text" data-f="an" value="${esc(a.n)}" aria-label="Nome da área"><input type="number" min="1" data-f="aq" value="${a.q || ''}" aria-label="Número de questões"><input type="text" data-f="am" value="${esc((a.mats || []).join(', '))}" placeholder="Ex.: Física, Química" aria-label="Matérias da área"><button type="button" class="icon-btn" data-x="delarea" aria-label="Remover área" title="Remover área">${ic('trash', 14)}</button></div>`;
  const modHTML = m => `<div class="mod-card" data-id="${esc(m.id || '')}">
    <div class="row"><label class="field" style="flex:2 1 200px"><span>Nome do modelo</span><input type="text" data-f="nome" value="${esc(m.nome)}" placeholder="Ex.: ENEM, FAMEMA, Simulado do cursinho"></label>
      <label class="field" style="flex:1 1 130px"><span>Meta · acertos no total</span><input type="number" min="0" data-f="metaTotal" value="${m.metaTotal || ''}" placeholder="Ex.: 160"></label>
      <label class="field" style="flex:1 1 130px"><span>Meta · acertos por área</span><input type="number" min="0" data-f="metaArea" value="${m.metaArea || ''}" placeholder="Ex.: 40"></label></div>
    <div class="lbl" style="margin-top:14px">Áreas · nome, nº de questões e matérias que entram nela (separe por vírgula)</div>
    <div class="mod-areas">${(m.areas || []).map(areaHTML).join('')}</div>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button type="button" class="btn sm" data-x="addarea">${ic('plus', 13)} Área</button><button type="button" class="btn sm danger" data-x="delmod">Remover modelo</button></div></div>`;
  const box = modal(`<h2>Modelos de prova</h2><p class="lead">Cada modelo tem as suas áreas, o número de questões e a meta. Os gráficos e análises de simulados mostram um modelo por vez, escolhido no topo.</p>
    <form class="form" id="f"><div><button type="button" class="btn" data-x="addmod">${ic('plus', 14)} Novo modelo</button></div>
      <div id="mods">${D0.map(modHTML).join('')}</div>
      <div class="foot"><button type="button" class="btn" data-x="cancel">Cancelar</button><button class="btn primary" type="submit">Salvar modelos</button></div></form>`, { wide: true });
  const collect = () => $$('.mod-card', box).map(c => ({ id: c.dataset.id || null, nome: $('[data-f=nome]', c).value.trim(), metaTotal: num($('[data-f=metaTotal]', c).value) || 0, metaArea: num($('[data-f=metaArea]', c).value) || 0,
    areas: $$('.mod-area', c).map(r => ({ n: $('[data-f=an]', r).value.trim(), q: num($('[data-f=aq]', r).value) || 0, mats: $('[data-f=am]', r).value.split(',').map(x => x.trim()).filter(Boolean) })) }));
  box.addEventListener('click', e => {
    const x = e.target.closest('[data-x]'); if (!x) return; const k = x.dataset.x, card = x.closest('.mod-card');
    if (k === 'cancel') { closeModal(); return; }
    if (k === 'addarea') { $('.mod-areas', card).insertAdjacentHTML('beforeend', areaHTML({ n: '', q: 45, mats: [] })); const r = $$('.mod-area', card).at(-1); $('[data-f=an]', r).focus({ preventScroll: true }); r.scrollIntoView({ block: 'nearest' }); }
    else if (k === 'delarea') x.closest('.mod-area').remove();
    else if (k === 'addmod') { $('#mods', box).insertAdjacentHTML('afterbegin', modHTML({ id: null, nome: '', metaTotal: 0, metaArea: 0, areas: [{ n: 'Geral', q: 60, mats: [] }] })); const c = $('.mod-card', box); $('[data-f=nome]', c).focus({ preventScroll: true }); c.scrollIntoView({ block: 'nearest' }); }
    else if (k === 'delmod') { if ($$('.mod-card', box).length < 2) { toast('Mantenha pelo menos um modelo.', 'err'); return; } card.remove(); }
  });
  $('#f', box).onsubmit = async e => {
    e.preventDefault(); const d = collect();
    if (!d.length) { toast('Mantenha pelo menos um modelo.', 'err'); return; }
    const names = new Set();
    for (const m of d) {
      if (!m.nome) { toast('Dê um nome a cada modelo.', 'err'); return; }
      if (names.has(m.nome.toLowerCase())) { toast('Dois modelos com o mesmo nome: ' + m.nome, 'err'); return; }
      names.add(m.nome.toLowerCase());
      if (!m.areas.length || m.areas.some(a => !a.n || !a.q)) { toast(`Em ${m.nome}, toda área precisa de nome e número de questões.`, 'err'); return; }
      if (new Set(m.areas.map(a => a.n.toLowerCase())).size !== m.areas.length) { toast(`Em ${m.nome}, há áreas com o mesmo nome.`, 'err'); return; }
    }
    const used = new Set(modelos().map(m => m.id));
    d.forEach(m => { if (!m.id) { let id = m.nome.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || uid(); while (used.has(id)) id += '-' + uid().slice(0, 3); m.id = id; used.add(id); } });
    try { await dbSet('config', 'geral', { ...S.cfg, modelos: d }); if (!S.db) S.cfg = { ...S.cfg, modelos: d }; if (!d.some(m => m.id === S.ui.modelo)) S.ui.modelo = d[0].id; closeModal(); toast('Modelos salvos.'); render(true); } catch (e2) { }
  };
}

const helpBtn = k => HELP[k] ? `<button type="button" class="help" data-act="help" data-k="${k}" aria-label="O que é isto?" title="O que é isto?">?</button>` : '';
function helpModal(k) {

}

(function () {
  const alvo = { 'Arte': ['Artes'], 'Filosofia': ['Filosofia e Sociologia'], 'Sociologia': ['Filosofia e Sociologia'] }, nrm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
  RAIOX.forEach(a => a.mats.forEach(m => (alvo[m.n] || [m.n]).forEach(k => {
    const g = SUBS[k]; if (!g) return; const have = new Set(Object.values(g).flat().map(nrm)), novos = m.a.map(x => x[0]).filter(n => !have.has(nrm(n)));
    if (novos.length) g['Mais cobrados no ENEM (Raio-X)'] = [...(g['Mais cobrados no ENEM (Raio-X)'] || []), ...novos];
  })));
})();
const RX_FONTE = 'SAS Educação · Raio X ENEM 2009–2025';
const rxNrm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
const RX_ALIAS = { 'lingua portuguesa': 'Português', portugues: 'Português', literatura: 'Português', gramatica: 'Português', 'lingua inglesa': 'Inglês', ingles: 'Inglês', 'lingua espanhola': 'Espanhol', espanhol: 'Espanhol', matematica: 'Matemática', fisica: 'Física', quimica: 'Química', biologia: 'Biologia', historia: 'História', geografia: 'Geografia', filosofia: 'Filosofia', sociologia: 'Sociologia', arte: 'Arte', artes: 'Arte', 'educacao fisica': 'Educação Física' };
const rxAreaTot = a => a.mats.reduce((s, m) => s + m.it, 0);
const rxArea = id => RAIOX.find(a => a.id === id);
const rxFind = nome => { const k = rxNrm(nome), t = RX_ALIAS[k] || nome; for (const a of RAIOX) { const m = a.mats.find(x => rxNrm(x.n) === rxNrm(t)); if (m) return { a, m }; } return null; };
/* devolve a matéria do Raio-X que corresponde ao nome usado nos simulados (ou null). "Filosofia e Sociologia" vira uma só. */
function rxMat(nome) {
  const parts = String(nome || '').split(/\s+e\s+|\s*\+\s*|\s*\/\s*/).map(s => s.trim()).filter(Boolean);
  const hits = (parts.length > 1 ? parts : [nome]).map(rxFind);
  if (!hits.length || hits.some(h => !h)) return null;
  const a = hits[0].a; if (hits.some(h => h.a !== a)) return null;
  const ms = hits.map(h => h.m), it = ms.reduce((s, m) => s + m.it, 0), tot = rxAreaTot(a), share = it / tot;
  const as = ms.length === 1 ? ms[0].a : ms.flatMap(m => m.a.map(([n, f]) => [n, f, m.n])).sort((x, y) => y[1] - x[1]).slice(0, 12);
  return { n: ms.map(m => m.n).join(' e '), area: a, it, share, cls: rxCls(share), q: share * 45, a: as, ms };
}
const rxCls = sh => sh >= .25 ? 'alta' : sh >= .05 ? 'media' : 'baixa';
const RX_CLS = { alta: 'Incidência alta', media: 'Incidência média', baixa: 'Incidência baixa' };
const rxQ = q => q < .95 ? '≈ 1 questão' : q < 1.5 ? '≈ 1 questão' : `≈ ${nf(q, 0)} questões`;
/* assunto digitado pelo aluno -> assunto do Raio-X (por palavras em comum); null se não bater */
function rxAssunto(rx, texto) {
  const tk = s => new Set(rxNrm(s).split(' ').filter(w => w.length > 3));
  const A = tk(texto); if (!A.size || !rx) return null; let best = null, bs = 0;
  rx.a.forEach(([n, f]) => { const B = tk(n); if (!B.size) return; let c = 0; A.forEach(w => { if (B.has(w) || [...B].some(b => b.startsWith(w) || w.startsWith(b))) c++; }); const sc = c / Math.min(A.size, B.size); if (sc > bs) { bs = sc; best = { n, f }; } });
  if (!best || bs < .75) return null;
  return { ...best, p: best.f / rx.it * 100 };
}
const rxCorte = rx => rx.a.length ? rx.a[rx.a.length - 1][1] / rx.it * 100 : 0;

/* desempenho por matéria (todos os simulados) cruzado com o peso no ENEM */
function rxCross() {
  const meta = +S.cfg.metaAcerto || 75, by = {};
  simsAllSorted().filter(s => isEnem(modeloOf(s))).forEach(s => matRows(s).forEach(r => {
    const t = +r.t; if (!(t > 0)) return; const rx = rxMat(r.m); if (!rx) return;
    (by[rx.n] = by[rx.n] || { rx, h: [] }).h.push({ d: s.data, a: +r.a || 0, t });
  }));
  const rows = Object.values(by).map(({ rx, h }) => {
    const rec = h.slice(-3), acc = rec.reduce((s, x) => s + x.a, 0) / rec.reduce((s, x) => s + x.t, 0) * 100;
    return { rx, acc, n: h.length, weak: acc < meta, score: (meta - acc) * rx.share, top: rx.a.slice(0, 3).map(x => x[0]) };
  });
  const prior = rows.filter(r => r.weak && r.rx.cls !== 'baixa').sort((a, b) => b.score - a.score);
  const wait = rows.filter(r => r.weak && r.rx.cls === 'baixa');
  const ok = rows.filter(r => !r.weak);
  rows.forEach(r => { r.st = !r.weak ? 'ok' : r.rx.cls === 'baixa' ? 'wait' : 'prior'; });
  return { meta, rows: [...prior, ...wait, ...ok], prior, wait, ok };
}
function rxText(r, X) {
  const nm = r.rx.n, sh = nf(r.rx.share * 100, 0) + '%', p = nf(r.acc, 0) + '%';
  if (r.st === 'prior') return `Você acerta ${p} (meta ${nf(X.meta, 0)}%) e ${nm} pesa cerca de ${sh} da área (${rxQ(r.rx.q)}). Vale priorizar. Comece por: ${r.top.join(', ')}.`;
  if (r.st === 'wait') { const alt = X.prior[0]; return `Você acerta ${p}, mas ${nm} pesa só ${nf(r.rx.share * 100, 1)}% da área (${rxQ(r.rx.q)}). Pode esperar${alt ? `: o tempo rende mais em ${alt.rx.n}` : ''}.`; }
  return `Acima da meta (${p}). Só manter o ritmo${r.rx.cls === 'baixa' ? '' : `; ${nm} tem peso ${r.rx.cls === 'alta' ? 'alto' : 'médio'} no ENEM`}.`;
}
/* assuntos em que o aluno mais erra (só quando há questões marcadas) x frequência no Raio-X */
/* agrupa as questões por assunto (área da matéria; ou o assunto digitado) e cruza com o Raio-X, que só traz os mais frequentes: assunto fora dele continua valendo */
function rxAssAgg(itens) {
  const M = {};
  (itens || []).forEach(q => {
    const nome = ((q.sub || q.ass || '') + '').trim(); if (!nome || !q.mat) return;
    const rx = rxMat(q.mat), hit = rx ? rxAssunto(rx, nome) : null, nm = hit ? hit.n : nome, k = q.mat + '|' + rxNrm(nm);
    const x = M[k] = M[k] || { n: nm, m: q.mat, rx, hit, err: 0, t: 0, nums: [] };
    if (q.st) { x.t++; if (q.st === 'e' || q.st === 'c') { x.err++; x.nums.push(q.n); } }
  });
  return Object.values(M).map(x => ({ ...x, p: x.t ? x.err / x.t * 100 : 0, corte: x.rx ? rxCorte(x.rx) : 0 }));
}
const rxAlertas = itens => rxAssAgg(itens).filter(x => x.err > 0 && x.hit).sort((a, b) => b.hit.p - a.hit.p || b.err - a.err);
function rxAssCross(back) {

}

  const st = sp.length > 1 ? `<div class="cr-st"><div><span class="sub">Média por volta</span><b class="mono">${crShort(sp.reduce((a, b) => a + b, 0) / sp.length)}</b></div><div><span class="sub">Mais rápida</span><b class="mono">${crShort(Math.min(...sp))}</b></div><div><span class="sub">Mais lenta</span><b class="mono">${crShort(Math.max(...sp))}</b></div></div>` : '';
  const rows = [...sp.keys()].reverse().map(i => `<li><span class="mono sub">${i + 1}</span><span class="mono">${crShort(sp[i])}</span><span class="mono sub">${crShort(L[i])}</span></li>`).join('');
  return `<section class="card tm-run" id="tm-card"><div class="row" style="justify-content:space-between;align-items:center"><div class="lbl">Cronômetro</div></div>
    <div class="tm-st">${run ? 'Correndo' : now ? 'Pausado' : 'Pronto'}</div><div class="tm-big mono" id="cr-big">${crFmt(now)}</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px"><button class="btn primary" data-act="crToggle">${run ? 'Pausar' : now ? 'Continuar' : 'Iniciar'}</button><button class="btn" data-act="crLap" ${run ? '' : 'disabled'}>Volta</button><button class="btn" data-act="crReset" ${now || L.length ? '' : 'disabled'}>Zerar</button><button class="btn" data-act="tmFull">Tela cheia</button></div>
    ${st}${L.length ? `<div class="lbl" style="margin-top:24px">Voltas</div><div class="cr-h sub"><span>#</span><span>Volta</span><span>Total</span></div><ul class="cr-laps">${rows}</ul>` : '<p class="sub" style="text-align:center;margin-top:22px">Use <b>Volta</b> para marcar o tempo de cada questão, redação ou bloco sem parar o cronômetro.</p>'}</section>`;
}
setInterval(() => { if (cr.t0 && S.route === 'timer' && S.ui.tmTab === 'cron') { const el = document.getElementById('cr-big'); if (el) el.innerHTML = crFmt(crNow()); } }, 100);
function tmHistView() {
  const c = tm && tm.hid ? tmCalc() : null;
  const list = S.tmh.map(r => {
    if (!(tm && tm.hid === r.id)) return r;
    const usado = c.t0 ? Math.max(0, Math.round((Math.min(c.eff, c.end) - c.t0) / 1000)) : r.usado;
    return { ...r, usado, st: c.ph === 'fim' ? 'finalizada' : tm.pausedAt ? 'pausada' : 'andamento', how: tm.how || r.how, simId: tm.simId || r.simId, ativa: true };
  });
  if (tm && tm.hid && !list.some(r => r.id === tm.hid)) list.push({ id: tm.hid, nome: tm.nome, pre: tm.pre, total: tm.total, ini: tm.ini, usado: c.t0 ? Math.round((Math.min(c.eff, c.end) - c.t0) / 1000) : 0, st: c.ph === 'fim' ? 'finalizada' : tm.pausedAt ? 'pausada' : 'andamento', how: tm.how, ativa: true });
  list.sort((a, b) => (b.ini || 0) - (a.ini || 0));
  if (!list.length) return `<section class="card"><div class="empty"><b>Nenhuma prova registrada ainda.</b><span class="sub">Toda prova que você começa no simulador entra aqui, finalizada ou pausada, com o tempo usado e o que faltou.</span></div></section>`;
  const nF = list.filter(r => r.st === 'finalizada').length, nP = list.length - nF;
  const row = r => {
    const dt = new Date(r.ini || 0), tot = r.total * 60, rest = Math.max(0, tot - (r.usado || 0));
    const fin = r.st === 'finalizada', ativa = !!r.ativa, pau = !fin && !ativa;
    const chip = fin ? (r.how === 'antes' ? ['Finalizada antes do tempo', 'ok'] : ['Finalizada · tempo esgotado', 'ok']) : ativa ? [r.st === 'pausada' ? 'Pausada agora' : 'Em andamento', 'run'] : ['Pausada · não finalizada', 'warn'];
    const falt = fin ? (r.how === 'antes' ? `sobraram ${tmDur(rest)}` : 'usou o tempo todo') : `faltam ${tmDur(rest)}`;
    const sim = r.simId && S.sims.find(x => x.id === r.simId);
    const acts = [
      pau && r.snap ? `<button class="btn sm" data-act="tmResume" data-id="${r.id}">Retomar</button>` : '',
      fin ? (sim ? `<button class="btn sm" data-act="simOpen" data-id="${sim.id}">Ver simulado</button>` : `<button class="btn sm" data-act="tmLancarRec" data-id="${r.id}">Lançar resultado</button>`) : '',
      !ativa ? `<button class="icon-btn" data-act="tmDelRec" data-id="${r.id}" aria-label="Excluir registro" title="Excluir registro">${ic('trash', 15)}</button>` : ''].join('');
    return `<div class="tmh-r"><div class="tmh-main"><b>${esc(r.nome)}</b><span class="sub">${dt.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' })} · ${tmClock(dt)}${sim ? ' · lançado: ' + esc(sim.nome) : ''}</span></div>
      <span class="tmh-st ${chip[1]}">${chip[0]}</span>
      <div class="tmh-t"><span class="mono">${tmDur(r.usado || 0)} de ${tmDur(tot)}</span><span class="sub">${falt}</span></div>
      <div class="tmh-a">${acts}</div></div>`;
  };
  return `<section class="card"><div class="lbl">Histórico de provas · ${list.length} ${list.length === 1 ? 'registro' : 'registros'}${nP ? ` · ${nP} ${nP === 1 ? 'não finalizada' : 'não finalizadas'}` : ''}${nF ? ` · ${nF} ${nF === 1 ? 'finalizada' : 'finalizadas'}` : ''}</div>
    <div class="tmh">${list.map(row).join('')}</div></section>`;
}
VIEWS.timer = function () {
  const tab = S.ui.tmTab === 'cron' ? 'cron' : S.ui.tmTab === 'hist' ? 'hist' : 'sim', tb = (k, l) => `<button class="pill" data-act="tmTab" data-k="${k}" aria-pressed="${tab === k}">${l}</button>`;
  return head('Simulador de prova', 'Faça seu simulado de forma imersiva, com etiquetas de tempo como as do ENEM, ou use o cronômetro livre. No fim, você lança o resultado.') +
    `<div class="chips" style="margin-bottom:18px">${tb('sim', 'Simulador')}${tb('cron', 'Cronômetro')}${tb('hist', 'Histórico')}</div>` + (tab === 'cron' ? crView() : tab === 'hist' ? tmHistView() : tm ? tmRun() : tmSetup());
};
const tmWake = () => { try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => { }); } catch (e) { } };
Object.assign(ACT, {
  tmTab: el => { S.ui.tmTab = el.dataset.k; render(true); },
  crToggle: () => { if (cr.t0) { cr.acc += Date.now() - cr.t0; cr.t0 = null; } else { cr.t0 = Date.now(); tmWake(); } crSave(); render(true); },
  crLap: () => { if (!cr.t0) return; cr.laps.push(crNow()); crSave(); render(true); },
  crReset: () => { cr = { acc: 0, t0: null, laps: [] }; crSave(); render(true); },
  tmInt: el => { tmDraft.int = +el.dataset.m; tmDraft.add = []; tmDraft.rm = []; render(true); },
  tmTagDel: el => { const v = +el.dataset.v; if (!tmDraft.rm.includes(v)) tmDraft.rm.push(v); tmDraft.add = tmDraft.add.filter(x => x !== v); render(true); },
  tmTagAdd: () => { const i = document.getElementById('tm-add'), v = Math.round(+i.value || 0); if (v < 1 || v >= (+tmDraft.total || 0)) { toast('Informe os minutos restantes, menor que a duração da prova.', 'err'); return; } tmDraft.rm = tmDraft.rm.filter(x => x !== v); if (!tmDraft.add.includes(v)) tmDraft.add.push(v); render(true); },
  tmTagReset: () => { tmDraft.add = []; tmDraft.rm = []; render(true); },
  tmPre: el => { const k = el.dataset.k, keep = tmDraft; tmDraft = { ...tmMk(k), modo: keep.modo, hora: keep.modo === 'hora' ? keep.hora : TM_PRE[k].h, som: keep.som, fiscal: keep.fiscal, sem: keep.sem, int: keep.int, ult: keep.ult }; render(true); },
  tmModo: el => { tmDraft.modo = el.dataset.k; render(true); },
  tmOpt: el => { const k = el.dataset.k; tmDraft[k] = !!el.checked; if (k === 'som' && el.checked) tmBeep(1, false, true); if (k === 'ult') { tmDraft.add = []; tmDraft.rm = []; } render(true); },
  tmStart: () => {
    const d = tmDraft, total = Math.round(+d.total || 0); if (total < 10) { toast('Defina o tempo da prova (mínimo 10 minutos).', 'err'); return; }
    let start = null;
    if (d.modo === 'hora') { const [h, m] = (d.hora || '').split(':').map(Number); if (isNaN(h)) { toast('Escolha o horário de início.', 'err'); return; } const t = new Date(); t.setHours(h, m, 0, 0); if (t.getTime() < Date.now() - 60000) { toast('Esse horário de hoje já passou. Escolha um horário à frente ou comece agora.', 'err'); return; } start = Math.max(t.getTime(), Date.now()); }
    const tags = tmDraftTags(d), delays = tags.map((v, i) => d.fiscal && i > 0 && v > 0 ? Math.round((20 + Math.random() * 130) * 1000) : 0);
    tm = { pre: d.pre, nome: (d.nome || 'Simulado').trim(), total, tags, delays, start, shift: 0, pausedAt: null, som: d.som, sem: d.sem, fiscal: d.fiscal, show: false, fired: {} };
    if (start) tmWake(); tmSave(); render(true);
  },
  tmGo: () => { tm.start = Date.now(); tm.shift = 0; tm.pausedAt = null; tm.fired = {}; tm.hid = null; tm.endedAt = null; tm.how = null; tm.fimOk = 0; tm.simId = null; tmBeep(1, true, tm.som !== false); tmWake(); tmSave(); render(true); tmTick(); },
  tmShow: () => { tm.show = !tm.show; tmSave(); const b = document.getElementById('tm-box'), r = document.getElementById('tm-rev'); if (b) b.hidden = !tm.show; if (r) r.textContent = (tm.show ? '^ Esconder' : 'v Revelar') + ' tempo de prova'; },
  tmPause: () => { if (tm.pausedAt) { tm.shift = (tm.shift || 0) + Date.now() - tm.pausedAt; tm.pausedAt = null; } else tm.pausedAt = Date.now(); tmSave(); if (tm.start && tmCalc().ph === 'prova') tmHist(tm.pausedAt ? 'pausada' : 'andamento'); render(true); },
  tmRestart: async () => { if (await confirmBox({ title: 'Recomeçar a prova?', text: 'O relógio volta ao início e as etiquetas voltam todas. O registro desta tentativa é apagado do histórico.', ok: 'Recomeçar', danger: true })) { if (tm.hid) dbDel('tmh', tm.hid).catch(() => { }); tm.hid = null; tm.fimOk = 0; tm.start = null; tm.shift = 0; tm.pausedAt = null; tm.fired = {}; tmSave(); render(true); } },
  tmFin: async () => {
    const c = tmCalc(); if (c.ph !== 'prova') return;
    if (!(await confirmBox({ title: 'Finalizar a prova agora?', text: `Ainda faltam ${tmDur((c.end - c.eff) / 1000)}. O tempo usado fica registrado e você poderá lançar o resultado.`, ok: 'Finalizar' }))) return;
    tm.endedAt = tm.pausedAt || Date.now(); tm.how = 'antes'; tm.fimOk = 1; tmHist('finalizada'); toast('Prova finalizada.'); render(true);
  },
  tmResume: el => {
    const r = S.tmh.find(x => x.id === el.dataset.id); if (!r || !r.snap) return;
    if (tm && tmCalc().ph === 'prova') { toast('Já existe uma prova em andamento. Pause ou finalize antes de retomar outra.', 'err'); return; }
    tm = { ...r.snap, pre: r.pre, nome: r.nome, total: r.total, hid: r.id, ini: r.ini, pausedAt: r.snap.pausedAt || r.upd || Date.now(), fired: {}, show: false, how: null, fimOk: 0, simId: null };
    tmSave(); S.ui.tmTab = 'sim'; render(true); toast('Prova retomada de onde parou. Aperte "Retomar" para o tempo voltar a correr.');
  },
  tmDelRec: async el => { if (await confirmBox({ title: 'Excluir este registro?', text: 'Só o registro do tempo some. Um simulado já lançado continua nas notas.', ok: 'Excluir', danger: true })) dbDel('tmh', el.dataset.id).catch(() => { }); },
  tmLancarRec: el => { const r = S.tmh.find(x => x.id === el.dataset.id); if (r) tmLancarPre(r.nome, r.pre, r.ini, r.usado, r.total, r.how, r.id); },
  tmFull: () => { const el = document.getElementById('tm-card') || document.getElementById('cr-card'); try { document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen(); } catch (e) { } },
  tmEnd: async () => {
    const c = tmCalc();
    if (c.ph === 'prova') {
      if (!(await confirmBox({ title: 'Sair desta prova?', text: 'Ela fica salva como pausada, com o tempo que falta, e você pode retomá-la depois pelo Histórico.', ok: 'Salvar como pausada' }))) return;
      if (!tm.pausedAt) tm.pausedAt = Date.now(); tmHist('pausada');
    } else if (c.ph === 'espera' && !(await confirmBox({ title: 'Escolher outra prova?', text: 'A prova marcada ainda não começou e será descartada.', ok: 'Escolher outra', danger: true }))) return;
    tm = null; tmSave(); try { document.fullscreenElement && document.exitFullscreen(); } catch (e) { } render(true);
  },
  tmReset: () => { tm = null; tmSave(); render(true); },
  tmLancar: () => { const c = tmCalc(); if (!tm.hid) tmHist('finalizada'); tmLancarPre(tm.nome, tm.pre, tm.ini || c.t0, c.t0 ? Math.round((Math.min(c.eff, c.end) - c.t0) / 1000) : 0, tm.total, tm.how || 'tempo', tm.hid); },
});
document.addEventListener('input', e => {
  const t = e.target; if (!t.closest || S.route !== 'timer' || tm) return;
  if (t.id === 'tm-nome') tmDraft.nome = t.value; else if (t.id === 'tm-hora') tmDraft.hora = t.value;
  else if (t.id === 'tm-h' || t.id === 'tm-m') {
    const h = Math.max(0, +document.getElementById('tm-h').value || 0), m = Math.max(0, +document.getElementById('tm-m').value || 0); tmDraft.total = h * 60 + m;
    const pv = document.getElementById('tm-prev'), nt = document.getElementById('tm-nt'), tg = tmDraftTags(tmDraft);
    if (pv) pv.innerHTML = tmTagsHtml(tg, null, true); if (nt) nt.textContent = tg.length;
  }
});
{
  const nav = NAV.find(n => n.g === 'SIMULADOS'); nav.items.push({ id: 'timer', label: 'Simulador de prova', icon: 'timer' });
  ROUTES.splice(0, ROUTES.length, ...NAV.flatMap(n => n.g ? n.items : [n]), ...(LITE ? [] : [{ id: 'sim-questoes', label: 'Notas' }]));
}

</script>
