<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Estudos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: pure-black app shell, one rounded sidebar card, fluid cards with hairline borders, mono numerals, white-on-black primary actions. Dark by choice. */
:root {
  --bg: #000000;
  --card: #0b0b0b;
  --card-2: #121212;
  --line: #1c1c1c;
  --line-2: #2c2c2c;
  --ink: #f1f1f1;
  --ink-2: #b4b4b4;
  --muted: #727272;
  --good: #0ca30c;
  --warn: #fab219;
  --bad: #e66767;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 var(--sans); color-scheme: dark; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
:focus-visible { outline: 2px solid #8a8a8a; outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
[hidden] { display: none !important; }

/* shell */
.app { height: 100%; display: grid; grid-template-rows: 46px minmax(0, 1fr); }
.titlebar { display: flex; align-items: center; gap: 12px; padding: 0 20px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: .01em; }
.brand svg { display: block; }
.brand b { font-weight: 700; }
.crumb { color: var(--muted); font-size: 13px; }
.tb-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.chip-info { font: 12px var(--mono); color: var(--ink-2); border: 1px solid var(--line-2); border-radius: 999px; padding: 4px 11px; }
.icon-btn { width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid transparent; background: transparent; border-radius: 9px; color: var(--ink-2); }
.icon-btn:hover { background: var(--card-2); border-color: var(--line); color: var(--ink); }
#menuBtn { display: none; }
.shell { display: grid; grid-template-columns: 256px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: 20px; padding: 0 20px 18px 14px; min-height: 0; }
.side { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 12px; overflow: auto; align-self: stretch; }
.nav-home, .nav-g, .nav-i { display: flex; align-items: center; gap: 12px; width: 100%; background: transparent; border: 0; border-radius: 10px; color: var(--ink-2); text-align: left; }
.nav-home { padding: 11px 14px; font-weight: 600; font-size: 14px; color: var(--ink); }
.nav-home[aria-current="page"], .nav-i[aria-current="page"] { background: #1a1a1a; color: var(--ink); }
.nav-g { margin-top: 12px; padding: 10px 14px 10px 14px; font-size: 11px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--ink-2); justify-content: space-between; }
.nav-g:hover, .nav-i:hover, .nav-home:hover { background: #141414; }
.nav-g svg { transition: transform .15s; }
.nav-g[aria-expanded="true"] svg { transform: rotate(90deg); }
.nav-i { padding: 10px 14px; font-size: 13px; }
.nav-i svg, .nav-home svg { flex: none; opacity: .8; }
.main { overflow: auto; min-width: 0; padding: 2px 2px 20px 0; }
.view { display: grid; gap: 16px; align-content: start; }
.view-head { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; padding: 2px 2px 0; }
.view-head h1 { font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.view-head p { color: var(--muted); margin-top: 3px; max-width: 62ch; }
.view-head .grow { flex: 1; }

/* cards */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px; min-width: 0; }
.card.tight { padding: 16px 18px; }
.lbl { font-size: 11px; letter-spacing: .02em; text-transform: uppercase; color: var(--ink-2); }
.sub { font-size: 12px; color: var(--muted); }
.big { font: 600 34px/1.1 var(--mono); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.big small { font-size: 26px; font-weight: 500; margin-left: 6px; color: var(--ink-2); }
.g-top { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 16px; }
.g-bot { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.g-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.hero-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.hero-side { text-align: right; }
.hero-side .v { font: 600 15px var(--mono); margin-top: 4px; }
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 16px 0 6px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { border: 1px solid var(--line-2); border-radius: 999px; padding: 6px 14px; background: transparent; color: var(--ink-2); font-size: 12px; line-height: 1.2; }
.pill:hover { border-color: #555; color: var(--ink); }
.pill[aria-pressed="true"] { background: #f1f1f1; border-color: #f1f1f1; color: #000; font-weight: 500; }
.pill .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; vertical-align: 0; }
.pill .n { font-family: var(--mono); opacity: .65; margin-left: 6px; font-size: 11px; }

/* buttons & forms */
.btn { border: 1px solid var(--line-2); background: transparent; color: var(--ink); border-radius: 10px; padding: 9px 16px; font-size: 12.5px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:hover { background: var(--card-2); border-color: #444; }
.btn.primary { background: #f5f5f5; color: #000; border-color: #f5f5f5; letter-spacing: .02em; text-transform: uppercase; font-size: 12px; font-weight: 600; }
.btn.primary:hover { background: #fff; }
.btn.primary.block { width: 100%; padding: 14px; }
.btn.sm { padding: 6px 11px; font-size: 12px; border-radius: 8px; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; }
.link:hover { color: var(--ink); }
.field { display: grid; gap: 6px; }
.field > span { font-size: 11px; text-transform: uppercase; letter-spacing: .02em; color: var(--ink-2); }
input[type=text], input[type=number], input[type=date], select, textarea { width: 100%; background: #0f0f0f; border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 12px; min-height: 38px; }
textarea { resize: vertical; min-height: 84px; line-height: 1.5; }
input:focus, select:focus, textarea:focus { border-color: #8a8a8a; outline: none; }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, #888 50%), linear-gradient(135deg, #888 50%, transparent 50%); background-position: calc(100% - 17px) 16px, calc(100% - 12px) 16px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
.row > .field { flex: 1 1 150px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }

/* tables */
.scroll-x { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; min-width: 640px; }
.tbl th { text-align: left; font-size: 11px; font-weight: 400; text-transform: uppercase; letter-spacing: .02em; color: var(--ink-2); padding: 0 10px 12px; }
.tbl td { padding: 11px 10px; border-top: 1px solid var(--line); vertical-align: middle; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: #101010; }
.tbl td.num, .tbl th.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.tbl .ico { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--card-2); display: grid; place-items: center; color: var(--ink-2); flex: none; }
.cell-name { display: flex; align-items: center; gap: 14px; }
.cell-name .t { font-size: 13.5px; }
.cell-name .s { font-size: 11px; color: var(--muted); }
.delta { font-family: var(--mono); font-size: 12px; display: inline-flex; align-items: center; gap: 5px; }
.delta.up svg { color: var(--good); } .delta.down svg { color: var(--bad); }
.tag { display: inline-block; border: 1px solid var(--line-2); border-radius: 6px; padding: 1px 7px; font-size: 11px; color: var(--ink-2); }
.tag.solid { background: #1b1b1b; }
.go { color: var(--muted); }

/* charts */
.chart { position: relative; width: 100%; min-height: 120px; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { font: 10px var(--mono); fill: var(--muted); }
.chart .lblv { fill: var(--ink); font-size: 11px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0 0 8px; color: var(--ink-2); font-size: 12px; }
.legend i { display: inline-block; width: 14px; height: 2px; border-radius: 2px; margin-right: 7px; vertical-align: 3px; position: relative; }
.legend i::after { content: ""; position: absolute; left: 4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: inherit; box-shadow: 0 0 0 2px var(--card); }
.tip { position: absolute; pointer-events: none; z-index: 5; background: #151515; border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 10px; font: 12px var(--mono); white-space: nowrap; box-shadow: 0 6px 24px rgba(0,0,0,.6); }
.tip .th { color: var(--ink-2); margin-bottom: 4px; font-family: var(--sans); font-size: 11px; }
.tip .tr { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.tip .tr b { font-weight: 500; }
.tip .sw { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.empty { color: var(--muted); padding: 34px 8px; text-align: center; border: 1px dashed var(--line-2); border-radius: 12px; }
.empty b { color: var(--ink-2); font-weight: 500; display: block; margin-bottom: 4px; }
.bars { display: grid; gap: 12px; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 150px) 1fr 64px; align-items: center; gap: 12px; }
.bar-row .n { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-row .tr { height: 10px; background: #151515; border-radius: 4px; position: relative; overflow: visible; }
.bar-row .fl { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; min-width: 2px; }
.bar-row .mk { position: absolute; top: -3px; bottom: -3px; width: 1px; background: #888; }
.bar-row .v { font: 12px var(--mono); text-align: right; color: var(--ink); white-space: nowrap; }
.bars.wide .bar-row { grid-template-columns: minmax(90px, 150px) 1fr 104px; }
.heat { border-collapse: separate; border-spacing: 3px; min-width: 100%; }
.heat th { font: 10px var(--mono); color: var(--muted); font-weight: 400; padding: 2px 4px; white-space: nowrap; }
.heat th.rh { text-align: left; font-family: var(--sans); font-size: 12px; color: var(--ink-2); padding-right: 12px; }
.heat td { text-align: center; font: 11px var(--mono); padding: 8px 6px; border-radius: 6px; min-width: 44px; }

/* health list */
.checks { display: grid; }
.check { display: grid; grid-template-columns: 22px 1fr; gap: 12px; padding: 13px 0; border-top: 1px solid var(--line); }
.check:first-child { border-top: 0; padding-top: 4px; }
.chk { width: 20px; height: 20px; border: 1px solid #555; border-radius: 4px; display: grid; place-items: center; margin-top: 1px; }
.chk.on { border-color: var(--good); color: var(--good); }
.chk.off { border-color: var(--warn); color: var(--warn); }
.check .t { font-size: 13.5px; }
.check .s { font-size: 12px; color: var(--muted); }
.events { display: grid; margin-top: 14px; }
.ev { display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); align-items: center; }
.ev:first-child { border-top: 0; }
.ev .ic { width: 30px; height: 30px; border: 1px solid var(--line-2); border-radius: 8px; display: grid; place-items: center; color: var(--ink-2); }
.ev .t { font-size: 13px; }
.ev .s { font-size: 11.5px; color: var(--muted); }
.ev .d { font: 11.5px var(--mono); color: var(--muted); }
.h-card { font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.kv { display: grid; gap: 11px; margin: 18px 0; }
.kv > div { display: flex; justify-content: space-between; gap: 12px; color: var(--ink-2); }
.kv b { font: 500 13px var(--mono); color: var(--ink); text-align: right; }
.mini { border: 1px solid var(--line-2); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; margin: 14px 0 18px; }
.mini > div { display: flex; justify-content: space-between; gap: 12px; }
.mini > div span:first-child { color: var(--muted); font-size: 12px; }
.mini > div span:last-child { text-align: right; font-size: 13px; }
.ring-wrap { display: grid; place-items: center; padding: 10px 0 0; }
.banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; border: 1px solid #3a3320; background: #15120a; color: #e8d9a8; border-radius: 12px; padding: 11px 16px; }
.banner.err { border-color: #4a2424; background: #170c0c; color: #f0b9b9; }
.banner .btn { margin-left: auto; }

/* modal & toasts */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.74); display: grid; place-items: center; padding: 16px; z-index: 50; }
.modal { width: min(640px, 100%); max-height: 94%; overflow: auto; background: #0e0e0e; border: 1px solid var(--line-2); border-radius: 16px; padding: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.7); }
.modal.wide { width: min(860px, 100%); }
.modal h2 { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
.modal .lead { color: var(--muted); margin-bottom: 16px; }
.modal .foot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
.modal .form { display: grid; gap: 14px; }
.mrow { display: grid; grid-template-columns: minmax(110px, 1fr) 84px 20px 84px; gap: 8px; align-items: center; }
.mrow label { color: var(--ink-2); }
.mrow span { text-align: center; color: var(--muted); }
.mgrid { display: grid; gap: 8px; max-height: 300px; overflow: auto; padding-right: 4px; }
.total-line { font: 500 13px var(--mono); color: var(--ink-2); }
.toasts { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: grid; gap: 8px; z-index: 80; width: min(460px, calc(100% - 32px)); }
.toast { background: #181818; border: 1px solid var(--line-2); border-radius: 12px; padding: 11px 16px; box-shadow: 0 10px 30px rgba(0,0,0,.6); }
.toast.err { border-color: #5a2a2a; }
.log { font: 12px/1.7 var(--mono); color: var(--ink-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; max-height: 220px; overflow: auto; background: #080808; }
.log .ok { color: var(--good); }
.progress { height: 6px; background: #1a1a1a; border-radius: 3px; overflow: hidden; margin: 12px 0; }
.progress > i { display: block; height: 100%; background: #f1f1f1; width: 0; transition: width .2s; }

/* questions */
.qs { display: grid; gap: 10px; }
.q { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: var(--card); display: grid; gap: 10px; }
.q.st-e { border-left: 3px solid var(--bad); }
.q.st-c { border-left: 3px solid var(--warn); }
.q.st-a { border-left: 3px solid var(--good); }
.q-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.q-head .n { font: 600 13px var(--mono); min-width: 40px; }
.q-head select { width: auto; min-height: 30px; padding: 3px 28px 3px 10px; font-size: 12px; border-radius: 8px; }
.q-head input[type=text] { width: 220px; flex: 1 1 160px; min-height: 30px; padding: 3px 10px; font-size: 12px; border-radius: 8px; }
.q-st { display: flex; gap: 6px; margin-left: auto; }
.st { border: 1px solid var(--line-2); background: transparent; border-radius: 8px; padding: 4px 10px; font-size: 12px; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
.st[aria-pressed="true"] { background: #f1f1f1; color: #000; border-color: #f1f1f1; }
.q-txt { color: var(--ink-2); white-space: pre-wrap; font-size: 12.5px; line-height: 1.55; max-height: 220px; overflow: auto; border-top: 1px solid var(--line); padding-top: 10px; }
.q-foot { display: flex; gap: 12px; align-items: center; font-size: 12px; color: var(--muted); }

/* thread / caderno */
.cad { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
.tlist { display: grid; gap: 0; }
.titem { display: grid; gap: 3px; text-align: left; width: 100%; background: transparent; border: 0; border-top: 1px solid var(--line); padding: 13px 8px; border-radius: 0; color: var(--ink); }
.titem:first-child { border-top: 0; }
.titem:hover { background: #101010; }
.titem[aria-current="true"] { background: #161616; border-radius: 10px; }
.titem .t { font-weight: 500; font-size: 13px; }
.titem .s { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.titem .m { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 11px; }
.thread { display: grid; gap: 0; }
.msg { padding: 16px 0; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.msg:first-child { border-top: 0; padding-top: 4px; }
.msg .who { display: flex; gap: 10px; align-items: center; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: var(--ink-2); }
.msg .who .tm { color: var(--muted); font-family: var(--mono); text-transform: none; letter-spacing: 0; }
.msg.me .body { white-space: pre-wrap; }
.composer { border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 10px; }
.composer .acts { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.ctx-chip { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line-2); border-radius: 999px; padding: 2px 10px; font-size: 11px; color: var(--ink-2); }

/* rendered markdown */
.md { line-height: 1.65; color: #dcdcdc; max-width: 78ch; }
.md > * + * { margin-top: 10px; }
.md h4 { font-size: 14px; font-weight: 600; color: var(--ink); margin-top: 18px; letter-spacing: -.005em; }
.md ul, .md ol { padding-left: 20px; margin-bottom: 0; }
.md li + li { margin-top: 4px; }
.md b, .md strong { color: var(--ink); font-weight: 600; }
.md code { font: 12px var(--mono); background: #181818; border-radius: 4px; padding: 1px 5px; }
.md table { border-collapse: collapse; font-size: 12.5px; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--line-2); padding: 6px 10px; text-align: left; }
.md th { background: #141414; font-weight: 500; }
.stream-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ink); margin-left: 6px; animation: blink 1s infinite; vertical-align: middle; }
@keyframes blink { 50% { opacity: .15; } }
@media (prefers-reduced-motion: reduce) { .stream-dot { animation: none; } .nav-g svg { transition: none; } }

/* responsive */
@media (max-width: 1180px) {
  .g-top { grid-template-columns: 1fr; }
  .g-bot { grid-template-columns: 1fr; }
  .g-2 { grid-template-columns: 1fr; }
}
@media (max-width: 900px) {
  html, body { overflow: auto; height: auto; }
  .app { height: auto; min-height: 100%; grid-template-rows: 46px auto; }
  .shell { grid-template-columns: 1fr; grid-template-rows: auto; padding: 0 12px 18px; gap: 12px; }
  .side { align-self: start; }
  .side { display: none; }
  .side.open { display: block; }
  #menuBtn { display: grid; }
  .main { overflow: visible; padding: 0; }
  .card { padding: 18px 16px; }
  .cad { grid-template-columns: 1fr; }
  .big { font-size: 30px; }
  .bar-row { grid-template-columns: minmax(70px, 110px) 1fr 54px; }
  .bars.wide .bar-row { grid-template-columns: minmax(70px, 110px) 1fr 92px; }
  .mrow { grid-template-columns: minmax(90px, 1fr) 70px 14px 70px; }
  .titlebar { padding: 0 12px; }
}

.model-sel { font: 12px var(--mono); color: var(--ink); background: var(--card); border: 1px solid var(--line-2); border-radius: 999px; padding: 5px 28px 5px 12px; height: auto; width: auto; max-width: 200px; }
@media (max-width: 900px) { .model-sel { max-width: 120px; } }
.mod-card { border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
.mod-area { display: grid; grid-template-columns: 1.2fr 70px 2fr 32px; gap: 8px; align-items: center; margin-top: 8px; }

/* ============ markdown (subset) ============ */
function md(src) {
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*\w])\*(?!\s)([^*]+?)\*(?!\w)/g, '$1<i>$2</i>').replace(/`([^`]+)`/g, '<code>$1</code>');
  const out = []; let list = null, tbl = null;
  const flush = () => {
    if (list) { out.push(`<${list.t}>${list.items.join('')}</${list.t}>`); list = null; }
    if (tbl) { const [h, ...rows] = tbl; out.push(`<table><thead><tr>${h.map(c => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`); tbl = null; }
  };
  String(src || '').replace(/\r/g, '').split('\n').forEach(raw => {
    const l = raw.trimEnd(); let m;
    if (!l.trim()) { flush(); return; }
    if ((m = l.match(/^#{1,4}\s+(.*)/))) { flush(); out.push(`<h4>${inline(m[1])}</h4>`); return; }
    if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (!list || list.t !== 'ul') { flush(); list = { t: 'ul', items: [] }; } list.items.push(`<li>${inline(m[1])}</li>`); return; }
    if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (!list || list.t !== 'ol') { flush(); list = { t: 'ol', items: [] }; } list.items.push(`<li>${inline(m[1])}</li>`); return; }
    if (l.trim().startsWith('|')) {
      if (/^\|?[\s:\-|]+\|?$/.test(l.trim())) return;
      if (list) flush(); tbl = tbl || []; tbl.push(l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim())); return;
    }
    flush(); out.push(`<p>${inline(l)}</p>`);
  });
  flush(); return out.join('');
}

function parseKey(str) {

  while ((m = re.exec(s))) out[+m[1]] = m[2];
  return out;
}

/* ============ versão LITE (site estático, sem Claude) ============ */
const LITE_KEY = 'pe-lite-v1';
function liteLoad() { try { return JSON.parse(localStorage.getItem(LITE_KEY)) || {}; } catch (e) { return {}; } }
function liteSave(st) { try { localStorage.setItem(LITE_KEY, JSON.stringify(st)); } catch (e) { toast('Não consegui salvar no navegador (armazenamento cheio ou bloqueado).', 'err'); throw e; } }
function liteDb() {
  const L = {}; // col -> [listeners]
  const snap = col => { const st = liteLoad(), c = st[col] || {}; return { docs: Object.keys(c).map(id => ({ id, data: () => clone(c[id]) })) }; };
  const notify = col => (L[col] || []).forEach(f => setTimeout(() => f(), 0));
  const mk = (col, id) => ({
    set: async data => { const st = liteLoad(); (st[col] = st[col] || {})[id] = clone(data); liteSave(st); notify(col); },
    delete: async () => { const st = liteLoad(); if (st[col]) delete st[col][id]; liteSave(st); notify(col); },
    onSnapshot: cb => { const f = () => { const st = liteLoad(), d = (st[col] || {})[id]; cb({ exists: d !== undefined, data: () => clone(d) }); }; (L[col] = L[col] || []).push(f); setTimeout(f, 0); return () => { L[col] = L[col].filter(x => x !== f); }; }
  });
  return {
    collection: col => ({ ...{ doc: id => mk(col, id) }, onSnapshot: cb => { const f = () => cb(snap(col)); (L[col] = L[col] || []).push(f); setTimeout(f, 0); return () => { L[col] = L[col].filter(x => x !== f); }; } }),
    doc: path => { const [col, id] = path.split('/'); return mk(col, id); }
  };
}
function liteExport() {
  const blob = new Blob([JSON.stringify({ app: 'painel-de-estudos', v: 1, data: liteLoad() })], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'painel-de-estudos-' + isoOf(new Date()) + '.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Backup baixado.');
}
function liteImport() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    try {
      const j = JSON.parse(await f.text()); const d = j && j.data; if (!d || typeof d !== 'object' || !(d.sim || d.red || d.config)) throw new Error('arquivo inválido');
      const ok = await confirmBox({ title: 'Importar dados?', text: 'Os dados deste navegador serão substituídos pelos do arquivo.', ok: 'Importar' }); if (!ok) return;
      liteSave(d); location.reload();
    } catch (e) { toast('Esse arquivo não parece um backup do painel.', 'err'); }
  };
  inp.click();
}

/* ---- conclusões calculadas ---- */
const meanOf = a => a.reduce((x, y) => x + y, 0) / (a.length || 1);
function trendOf(v) { const n = v.length; if (n < 2) return null; const k = Math.min(3, Math.floor(n / 2)); return { before: meanOf(v.slice(-2 * k, -k)), now: meanOf(v.slice(-k)) }; }
function liteAreas() {
  const by = {};
  simsAllSorted().forEach(s => { if (!hasAreas(modeloOf(s))) return; (s.mats || []).forEach(m => { if (m.t) (by[m.m] = by[m.m] || []).push((+m.a || 0) / m.t * 100); }); });
  const er = errRank(); const ep = Object.fromEntries(er.areas.map(a => [a.n, a]));
  return Object.entries(by).map(([n, v]) => { const t = trendOf(v); return { n, v, t, d: t ? t.now - t.before : null, e: ep[n] || null }; });
}
function liteComps() {
  const reds = redsSorted().filter(redOk); const rows = [];
  for (let i = 0; i < 5; i++) { const v = reds.map(r => (r.c || [])[i]).filter(x => x != null); if (!v.length) continue; const t = trendOf(v); rows.push({ n: 'C' + (i + 1), v, t, d: t ? t.now - t.before : null, avg: meanOf(v), last: v.at(-1) }); }
  return rows;
}
const sgn = (d, u) => d == null ? '—' : (d >= 0 ? '+' : '−') + nf(Math.abs(d), u === 'pts' ? 0 : 1) + (u === 'pts' ? ' pts' : ' p.p.');
function liteHighlights(A) {
  const w = A.filter(x => x.d != null), up = [...w].sort((a, b) => b.d - a.d)[0], dn = [...w].sort((a, b) => a.d - b.d)[0];
  const er = A.filter(x => x.e).sort((a, b) => b.e.p - a.e.p)[0];
  return { up: up && up.d > 0 ? up : null, dn: dn && dn.d < 0 ? dn : null, er };
}
function liteCard() {
  const A = liteAreas(), H = liteHighlights(A);
  return `<section class="card" aria-label="Conclusões"><div class="lbl">Conclusões</div>
    <div class="sub" style="margin-top:3px">calculadas com os seus simulados</div>
    <div class="kv" style="margin:22px 0 0;padding-top:16px;border-top:1px solid var(--line)">
      <div><span>Mais melhorou</span><b>${H.up ? esc(H.up.n) + ' ' + sgn(H.up.d) : '—'}</b></div>
      <div><span>Mais caiu</span><b>${H.dn ? esc(H.dn.n) + ' ' + sgn(H.dn.d) : '—'}</b></div>
      <div><span>Mais erro</span><b>${H.er ? esc(H.er.n) + ' · ' + nf(H.er.e.p, 0) + '%' : '—'}</b></div>
      <div><span>Meta</span><b>${metaShort(activeModelo())}</b></div>
    </div><button class="btn primary block" style="margin-top:18px" data-act="go" data-id="conclusoes">Ver conclusões</button></section>`;
}
VIEWS.conclusoes = function () {
  const A = liteAreas(), H = liteHighlights(A), C = liteComps(), sc = ['last', 'last3'].includes(S.ui.errScope) ? S.ui.errScope : 'all', rk = errRank();
  const tile = (t, x, v, sub, cls) => `<div class="card" style="padding:16px"><div class="lbl">${t}</div><div class="big ${cls || ''}" style="margin-top:10px;font-size:22px">${x ? esc(x.n) : '—'}</div><div class="sub" style="margin-top:4px">${x ? v : sub}</div></div>`;
  const scope = `<div class="chips">${[['all', 'Todos os simulados'], ['last3', 'Últimos 3'], ['last', 'Último']].map(([k, l]) => `<button class="pill" data-act="errScope" data-k="${k}" aria-pressed="${sc === k}">${l}</button>`).join('')}</div>`;
  const rows = [...A].sort((a, b) => (b.e ? b.e.p : -1) - (a.e ? a.e.p : -1)).map(a => `<tr><td>${esc(a.n)}</td><td class="mono">${a.t ? nf(a.t.before, 0) + '%' : '—'}</td><td class="mono">${a.t ? nf(a.t.now, 0) + '%' : nf(a.v.at(-1), 0) + '%'}</td><td class="mono">${a.d == null ? '—' : `<span class="${a.d >= 0 ? 'pos' : 'neg'}">${sgn(a.d)}</span>`}</td><td class="mono">${a.e ? a.e.err + ' de ' + a.e.t + ' · ' + nf(a.e.p, 0) + '%' : '—'}</td></tr>`).join('');
  const crows = C.map(c => `<tr><td>${c.n}</td><td class="mono">${c.t ? nf(c.t.before, 0) : '—'}</td><td class="mono">${c.t ? nf(c.t.now, 0) : nf(c.last, 0)}</td><td class="mono">${c.d == null ? '—' : `<span class="${c.d >= 0 ? 'pos' : 'neg'}">${sgn(c.d, 'pts')}</span>`}</td><td class="mono">${nf(200 - c.avg, 0)} pts</td></tr>`).join('');
  const cw = C.filter(x => x.d != null), cup = [...cw].sort((a, b) => b.d - a.d)[0], cdn = [...cw].sort((a, b) => a.d - b.d)[0], cweak = [...C].sort((a, b) => a.avg - b.avg)[0];
  return head('Conclusões', 'Calculadas com os seus simulados e redações: o que melhorou, o que caiu e onde você mais erra.', scope) +
    `<div class="g-3">${tile('Área que mais melhorou', H.up, H.up ? `${nf(H.up.t.before, 0)}% → ${nf(H.up.t.now, 0)}% (${sgn(H.up.d)})` : '', 'Precisa de pelo menos 2 simulados', 'good')}
      ${tile('Área que mais caiu', H.dn, H.dn ? `${nf(H.dn.t.before, 0)}% → ${nf(H.dn.t.now, 0)}% (${sgn(H.dn.d)})` : '', A.some(x => x.d != null) ? 'Nenhuma área caiu' : 'Precisa de pelo menos 2 simulados')}
      ${tile('Área em que mais erra', H.er, H.er ? `${H.er.e.err} erros em ${H.er.e.t} questões · ${nf(H.er.e.p, 0)}% de erro` : '', 'Lance um simulado')}</div>
    <section class="card"><div class="lbl">Por área · ${rk.units.length ? 'base: ' + rk.units.map(esc).join(' · ') : 'sem simulados'}</div>
      ${A.length ? `<div class="scroll-x" style="margin-top:12px"><table class="tbl"><thead><tr><th>Área</th><th>Antes</th><th>Agora</th><th>Variação</th><th>Erros (${sc === 'all' ? 'todos' : sc === 'last3' ? 'últimos 3' : 'último'})</th></tr></thead><tbody>${rows}</tbody></table></div><p class="sub" style="margin-top:10px">“Antes” e “Agora” comparam a média dos simulados mais recentes com a dos anteriores, na mesma quantidade (até 3 de cada).</p>` : '<div class="empty"><b>Nada para comparar ainda</b>Lance dois ou mais simulados com acertos por área.</div>'}</section>
    <section class="card"><div class="row" style="align-items:center"><span class="lbl">Redação · por competência</span><span style="margin-left:auto">${redTipoChips()}</span></div>
      ${C.length ? `<div class="g-3" style="margin-top:14px"><div><div class="sub">Mais melhorou</div><b>${cup && cup.d > 0 ? cup.n + ' ' + sgn(cup.d, 'pts') : '—'}</b></div><div><div class="sub">Mais caiu</div><b>${cdn && cdn.d < 0 ? cdn.n + ' ' + sgn(cdn.d, 'pts') : '—'}</b></div><div><div class="sub">Onde mais perde pontos</div><b>${cweak ? cweak.n + ' · média ' + nf(cweak.avg, 0) : '—'}</b></div></div>
      <div class="scroll-x" style="margin-top:14px"><table class="tbl"><thead><tr><th>Competência</th><th>Antes</th><th>Agora</th><th>Variação</th><th>Perde em média</th></tr></thead><tbody>${crows}</tbody></table></div>` : '<div class="empty"><b>Sem redações</b>Lance uma redação para ver as competências.</div>'}</section>`;
};
if (LITE) {
  const grp = NAV.findIndex(n => n.g === 'ESTUDO'); NAV.splice(grp, 1, { id: 'conclusoes', label: 'Conclusões', icon: 'target' });
  ROUTES.splice(0, ROUTES.length, ...NAV.flatMap(n => n.g ? n.items : [n]));
  ACT.simOpen = el => simDetail(el.dataset.id);
  ACT.cfg = ACT.cfg;
}

init();

</script>
